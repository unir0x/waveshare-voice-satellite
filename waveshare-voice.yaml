            width: 340
            height: 18
            min_value: 0
            max_value: 5
            value: 5
            gesture_bubble: false
            bg_color: 0x303840
            bg_opa: COVER
            radius: 9
            indicator:
              bg_color: 0x00C8FF
              radius: 9
            knob:
              bg_color: 0xFFFFFF
              pad_all: 10
            on_value:
              - lvgl.label.update:
                  id: lbl_assist_val
                  text: !lambda |-
                    int p = (int) x;
                    return p == 0 ? std::string("OFF") : str_sprintf("%d %%", 75 + p * 5);
            on_release:
              - if:
                  condition:
                    lambda: return lv_slider_get_value(id(sl_assist)) == 0;
                  then:
                    - media_player.mute: va_media_player
                  else:
                    - media_player.unmute: va_media_player
                    - media_player.volume_set:
                        id: va_media_player
                        volume: !lambda return 0.75f + lv_slider_get_value(id(sl_assist)) * 0.05f;
